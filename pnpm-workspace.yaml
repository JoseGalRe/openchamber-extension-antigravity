autoInstallPeers: true

blockExoticSubdeps: true

dedupePeers: true

engineStrict: true

# Set a minimum release age (in minutes) for packages to be considered for installation.
# This helps avoid installing packages that were just published and may not be fully propagated yet.
# And also helps to reduce the chain attack target in npm registry.
minimumReleaseAge: 1440

# Released together with this extension: the plugin it carries and the SDK of the OpenChamber it targets.
minimumReleaseAgeExclude:
  - '@josegalre/opencode-plugin-antigravity-acp'
  - '@openchamber/sdk'

saveExact: true

savePrefix: ''

shellEmulator: true

strictPeerDependencies: true

trustLockfile: true

verifyDepsBeforeRun: false
